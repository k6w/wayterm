[package]
name = "nexterm"
version = "0.1.0"
edition = "2021"

[lib]
name = "nexterm_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "nexterm"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
window-vibrancy = "0.5"
dirs = "6"
parking_lot = "0.12"
tauri-plugin-single-instance = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
